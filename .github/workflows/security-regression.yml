name: Wasl CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Unit and security tests
        run: npm test
      - name: Integration and frontend contract tests
        run: node --test tests/integration/*.test.cjs tests/i18n_contract.test.cjs tests/shift-import/import.test.cjs
      - name: Repository security scan
        run: npm run security:scan
      - name: Build Backend v1
        run: npm run backend:build
      - name: Validate Compose configuration
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
        run: docker compose config --quiet
      - name: Build Docker image
        run: docker build --tag wassl-backend:ci --file backend/Dockerfile backend
