name: Wasl v1.1 regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Typecheck and build Backend v1
        run: npm run backend:typecheck && npm run backend:build
      - name: Repository security scan
        run: npm run security:scan
      - name: Security regression contracts
        run: npm run test:security
