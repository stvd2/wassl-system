<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وصل v9.0 | نظام إدارة الإحالات الطبية</title>
<style>
:root{--navy:#123047;--teal:#087f78;--bg:#f3f6f8;--card:#fff;--text:#20313d;--muted:#70818c;--line:#e4eaee;--red:#c44747;--green:#17845b;--amber:#a66b12;--purple:#6c4ab0;--shadow:0 8px 28px rgba(20,48,65,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);font-size:14px;line-height:1.5}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font:inherit;transition:all .15s}
.primary{background:var(--teal);color:#fff}.primary:hover{background:#066d67}.primary:disabled{opacity:.5;cursor:not-allowed}
.success{background:var(--green);color:#fff}.success:hover{background:#0f6b48}
.warn{background:#fef3c7;color:#92400e;border:1px solid #f0d080}.warn:hover{background:#fde68a}
.secondary{background:#eaf3f3;color:var(--teal)}.secondary:hover{background:#d9edeb}
.danger{background:#fff0f0;color:var(--red)}.danger:hover{background:#ffe0e0}
.ghost{background:#f2f5f7;color:#435560}.ghost:hover{background:#e6ecf0}
.sm{padding:6px 12px;font-size:12px}.xs{padding:4px 10px;font-size:11px}
.hidden{display:none!important}
input,select,textarea{border:1px solid #d9e2e7;border-radius:10px;padding:11px 13px;background:#fff;outline:none;font:inherit;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0b9b9118}
textarea{min-height:90px;resize:vertical}
.offline-badge{position:fixed;top:8px;left:8px;background:#17845b;color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.offline-badge::before{content:'●';color:#a8ffd8;margin-left:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.lw{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#102d43,#145b61)}
.login{width:min(440px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 20px 60px #061d2a55}
.login-logos{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid #e0e5ea;min-height:60px}
.login-logos img{max-height:52px;max-width:48%;object-fit:contain}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:50px;height:50px;border-radius:14px;background:linear-gradient(145deg,#0b9b91,#123047);display:grid;place-items:center;color:#fff;font-size:25px;font-weight:900}
.brand h1{margin:0;font-size:27px;color:var(--navy)}.brand p{margin:2px 0;color:var(--muted);font-size:12px}
.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:700;color:#435560}
.hint{background:#f1f7f7;border:1px solid #dcebea;border-radius:10px;padding:12px;font-size:11.5px;color:#52666e;line-height:1.9;margin-top:16px}
.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tl{display:flex;align-items:center;gap:12px}.mini{width:36px;height:36px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:900}
.ur{display:flex;align-items:center;gap:12px}.av{width:38px;height:38px;border-radius:50%;background:#e4f2f0;color:var(--teal);display:grid;place-items:center;font-weight:800}
.notif-btn{position:relative;background:#f2f5f7;color:#435560;padding:9px 13px;border-radius:10px;font-size:18px}
.notif-btn:hover{background:#e6ecf0}
.notif-btn .badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 66px)}
aside{background:#fff;border-left:1px solid var(--line);padding:18px 12px;overflow-y:auto;max-height:calc(100vh - 66px)}
.nav{width:100%;text-align:right;background:transparent;color:#536771;padding:10px 12px;border-radius:8px;margin:2px 0;display:flex;align-items:center;gap:8px;font-weight:600;border:0;font-size:13px}
.nav:hover,.nav.active{background:#eaf5f4;color:var(--teal)}
.nav .count{background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-right:auto;font-weight:700}
main{padding:24px;min-width:0}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.ph h2{margin:0;color:var(--navy);font-size:23px;font-weight:700}
.ph p{margin:6px 0 0;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:all .15s}
.stat:hover{transform:translateY(-2px);border-color:var(--teal)}
.stat label{font-size:12px;color:var(--muted);display:block;margin-bottom:8px}
.stat strong{display:block;font-size:28px;color:var(--navy);font-weight:700;line-height:1}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 16px;color:var(--navy);font-size:16px;font-weight:700}
table.t{width:100%;border-collapse:collapse;min-width:1000px}
table.t th,table.t td{padding:12px 10px;text-align:right;border-bottom:1px solid #edf1f3;font-size:13px;vertical-align:top}
table.t th{color:#71828b;font-size:11.5px;background:#fafcfc;font-weight:700}
table.t tr:hover td{background:#fafcfc}
.twrap{overflow:auto;border-radius:10px}
.pill{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;background:#eef2f4;color:#53636b;display:inline-block;white-space:nowrap}
.p-doc{background:#fff5df;color:#94620c}
.p-warn{background:#fef3c7;color:#92400e}
.p-acc{background:#e6f7f2;color:#0b7a63}
.p-r{background:#ffeded;color:#b43f3f}
.p-bed{background:#f0eaff;color:#6c4ab0}
.p-done{background:#e5f6ed;color:#16734e}
.p-purple{background:#ede9fe;color:#6d28d9}
.p-cons{background:#F1F5F6;color:#344B52;border:1px solid #D7E0E3}
.p-new{background:#e0f2fe;color:#0369a1;font-size:10px;padding:3px 8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}.full{grid-column:1/-1}
.modal-back{position:fixed;inset:0;background:#0b2536a8;display:grid;place-items:center;padding:18px;z-index:20;backdrop-filter:blur(2px)}
.modal{background:#fff;width:min(920px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:24px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.mh h3{margin:0;color:var(--navy);font-size:18px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.dgrid .d{background:#f7f9fa;padding:12px;border-radius:8px}
.dgrid .d small{display:block;color:var(--muted);font-size:10.5px;margin-bottom:4px}
.dgrid .d strong{font-size:12.5px;color:var(--navy)}
.toast{position:fixed;bottom:20px;left:20px;background:#17394b;color:#fff;padding:12px 18px;border-radius:10px;z-index:99;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.2);max-width:420px;animation:slideIn .2s}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}.toast.warn{background:var(--amber)}
@keyframes slideIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
.notice{background:#fff8e9;color:#86601b;padding:12px 14px;border-radius:8px;font-size:12.5px;margin-bottom:14px;line-height:1.6;border:1px solid #f0e0b8}
.notice.danger{background:#fff0f0;color:#a33;border-color:#f0c8c8}
.notice.info{background:#e8f4f8;color:#1a6b8a;border-color:#b8dde8}
.notice.success{background:#e7f6ee;color:#0b6b3a;border-color:#b8e0c8}
.att-list{display:grid;gap:8px;margin-top:10px}
.att{display:flex;align-items:center;gap:10px;background:#f7f9fa;border:1px solid var(--line);padding:10px;border-radius:8px}
.att-meta{flex:1;min-width:0}.att-meta b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-meta small{color:var(--muted);font-size:11px}
.file-icon{width:36px;height:36px;background:#eaf3f3;color:var(--teal);border-radius:8px;display:grid;place-items:center;font-size:15px;flex:none}
.searchbox{max-width:340px;padding:10px 14px}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}
.empty-icon{font-size:48px;margin-bottom:14px;opacity:.5}
.storage-info{background:#f0f6ff;border:1px solid #d0e0f0;border-radius:8px;padding:10px 14px;font-size:12px;color:#1a4a7a;margin-top:8px;line-height:1.6}
.storage-info b{color:var(--navy)}
.timeline{position:relative;padding-right:32px;margin:16px 0}
.timeline::before{content:'';position:absolute;right:10px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:12px 0 16px 0;border-bottom:1px dashed var(--line)}
.tl-item:last-child{border-bottom:0}
.tl-item::before{content:'';position:absolute;right:-26px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 2px var(--teal)}
.tl-item.cancelled::before,.tl-item.rejected::before{background:var(--red);box-shadow:0 0 0 2px var(--red)}
.tl-item.completed::before{background:var(--green);box-shadow:0 0 0 2px var(--green)}
.tl-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.tl-action{font-weight:700;color:var(--navy);font-size:13.5px}
.tl-time{font-size:11.5px;color:var(--muted)}
.tl-user{font-size:12px;color:var(--teal);margin-bottom:4px}
.tl-detail{font-size:12.5px;color:#445;line-height:1.6;background:#f7f9fa;padding:8px 10px;border-radius:6px;margin-top:6px;white-space:pre-wrap}
.action-form{padding:18px;background:#f0f6ff;border-radius:12px;margin-bottom:14px;border:1px solid #d0e0f0}
.action-form h4{margin:0 0 14px;color:var(--navy);font-size:14.5px;display:flex;align-items:center;gap:10px;font-weight:700}
.action-form h4::before{content:'▸';color:var(--teal);font-size:18px}
.bed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.bed-card{border:2px solid var(--line);border-radius:10px;padding:14px;background:#fff;transition:all .15s}
.bed-card.free{border-color:#b9e4d0;background:#f2fbf6}
.bed-card.busy{background:#fafbfc;border-color:#e8d0d0;opacity:.75}
.bed-card strong{display:block;color:var(--navy);font-size:15px;margin-bottom:6px;font-weight:700}
.bed-card small{display:block;color:var(--muted);font-size:11.5px}
.bed-card .badge{margin-top:10px}
.notif-item{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line);background:#fff;cursor:pointer;transition:background .15s}
.notif-item:hover{background:#f7f9fa}
.notif-item.unread{background:#e8f4f8;border-right:3px solid var(--teal)}
.notif-item .icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:17px}
.actor-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:#e0e9f5;color:#123047;margin-right:8px}
.pw-bar{height:6px;background:#eef2f4;border-radius:3px;margin-top:6px;overflow:hidden}
.pw-bar-fill{height:100%;width:0;transition:all .2s;background:#c44747}
.pw-hint{font-size:11px;color:var(--muted);margin-top:4px}
.recover-box{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:2px;font-family:monospace;padding:14px;background:#fff;border-radius:8px;text-align:center;user-select:all;border:2px dashed var(--teal)}
.track-box{font-size:26px;font-weight:900;color:var(--teal);letter-spacing:3px;font-family:monospace;padding:16px;background:#fff;border-radius:10px;text-align:center;user-select:all;border:2px dashed var(--teal);direction:ltr}
.type-chip{display:inline-block;padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-er{background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5}
.t-ip{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.t-cl{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.t-cs{background:#F1F5F6;color:#344B52;border:1px solid #D7E0E3}
.type-info-box{background:#fff;border:2px solid var(--teal);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.type-info-box small{color:var(--muted);font-size:11.5px;display:block;margin-bottom:3px;font-weight:600}
.type-info-box strong{font-size:14px;color:var(--navy)}
.cons-box{background:#F1F5F6;border:2px solid #5A727A;border-radius:12px;padding:16px;margin-bottom:14px}
.cons-box h4{margin:0 0 12px;color:#344B52;font-size:15px;display:flex;align-items:center;gap:10px}
.cons-box .cons-section{background:#fff;border-radius:8px;padding:12px;margin-bottom:10px;border:1px solid #D7E0E3;border-right:3px solid #5A727A}
.cons-box .cons-section:last-child{margin-bottom:0}
.cons-box .cons-section small{color:#344B52;font-size:11px;font-weight:700;display:block;margin-bottom:4px}
.cons-box .cons-section p{margin:0;line-height:1.7;font-size:13px;color:var(--text);white-space:pre-wrap}

/* ═══════ الدردشة ═══════ */
.chat-wrap{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 66px - 100px);background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.chat-side{background:#f7f9fa;border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.chat-head{padding:12px 14px;border-bottom:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none}
.chat-tab{display:flex;gap:4px;padding:8px;background:#f7f9fa;border-bottom:1px solid var(--line);flex:none}
.chat-tab button{flex:1;padding:8px 6px;font-size:11.5px;font-weight:700;border-radius:8px;background:transparent;color:var(--muted);position:relative;border:0}
.chat-tab button.active{background:#fff;color:var(--teal);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chat-tab button .cnt{background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;margin-right:3px}
.chat-item{display:flex;gap:10px;padding:12px;cursor:pointer;border-bottom:1px solid #edf1f3;transition:background .15s;align-items:center}
.chat-item:hover{background:#eef4f5}
.chat-item.active{background:#e6f2f1;border-right:3px solid var(--teal)}
.chat-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#087f78,#0b9b91);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.chat-item .meta{flex:1;min-width:0}
.chat-item .meta b{display:block;font-size:13px;color:var(--navy);margin-bottom:2px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .meta small{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .unread{background:var(--red);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;align-self:center;min-width:20px;text-align:center}
.chat-main{display:flex;flex-direction:column;overflow:hidden;background:#efeae2}
.chat-main-head{padding:12px 18px;border-bottom:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;align-items:center;flex:none;gap:10px}
.chat-main-head b{font-size:14px;color:var(--navy)}
.chat-main-head small{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.chat-msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:72%;padding:8px 12px;border-radius:10px;font-size:13.5px;line-height:1.5;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.06);align-self:flex-start;background:#fff;border-top-left-radius:2px}
.msg.mine{align-self:flex-end;background:#dcf8c6;border-top-left-radius:10px;border-top-right-radius:2px}
.msg .sender{font-size:11px;font-weight:700;color:var(--teal);margin-bottom:3px}
.msg .txt{white-space:pre-wrap;color:var(--text)}
.msg .time{font-size:10px;color:var(--muted);margin-top:4px;text-align:left}
.msg .atts{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.msg .att-file{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.06);padding:6px 8px;border-radius:6px;font-size:11.5px;cursor:pointer;font-weight:600}
.msg .att-file:hover{background:rgba(0,0,0,.1)}
.chat-input{padding:10px 12px;background:#f0f2f5;display:flex;gap:8px;align-items:flex-end;flex:none;border-top:1px solid var(--line)}
.chat-input textarea{flex:1;min-height:42px;max-height:120px;resize:none;border-radius:20px;padding:10px 14px;font-size:13.5px;line-height:1.4}
.chat-input .att-btn{width:42px;height:42px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:18px;background:#fff;border:1px solid var(--line);flex:none}
.chat-input .send-btn{width:42px;height:42px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:18px;background:var(--teal);color:#fff;flex:none}
.chat-empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:20px;background:#efeae2}
.chat-empty .icon{font-size:64px;opacity:.4;margin-bottom:12px}
.chat-back-btn{display:none}

/* ═══════ المناوبون ═══════ */
.oncall-banner{background:linear-gradient(135deg,#087f78,#0b9b91);color:#fff;padding:14px 18px;border-radius:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow)}
.oncall-banner h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.oncall-banner .oncall-list{display:flex;gap:6px;flex-wrap:wrap}
.oncall-chip{background:rgba(255,255,255,.25);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700}
.shift-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.shift-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;transition:all .15s}
.shift-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.shift-card.today{border-color:var(--teal);box-shadow:0 0 0 3px #0b9b9118;background:#f0fdfa}
.shift-card.past{opacity:.6}
.shift-card .sh-date{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
.shift-card .sh-user{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:2px}
.shift-card .sh-role{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.shift-card .sh-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10.5px;font-weight:700;background:#eaf3f3;color:var(--teal)}
.shift-card .sh-badge.evening{background:#fef3c7;color:#92400e}
.shift-card .sh-badge.night{background:#ede9fe;color:#6d28d9}
.shift-card .sh-notes{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic}
.shift-card .sh-del{position:absolute;top:10px;left:10px;background:#fff0f0;color:var(--red);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;border:0;cursor:pointer}

/* ═══════ مسار الإحالة متعدد الأقسام ═══════ */
.routing{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.routing-node{flex:1;min-width:110px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;text-align:center;display:grid;gap:2px;transition:all .15s}
.routing-node .rn-icon{font-size:16px;line-height:1}
.routing-node b{font-size:12px;color:var(--navy);font-weight:700}

function loadImageAsDataURL(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    let done = false;
    const finish = (val) => { if (!done) { done = true; resolve(val); } };
    const timeout = setTimeout(() => finish(null), 10000);
    img.onload = () => {
      clearTimeout(timeout);
      try {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth || img.width;
        c.height = img.naturalHeight || img.height;
        c.getContext('2d').drawImage(img, 0, 0);
        finish(c.toDataURL('image/png'));
      } catch(e) { finish(null); }
    };
    img.onerror = () => { clearTimeout(timeout); finish(null); };
    img.src = url;
  });
}

async function preloadLogos(force = false) {
  if (LOGO_PRELOAD_PROMISE && !force) return LOGO_PRELOAD_PROMISE;
  LOGO_PRELOAD_PROMISE = (async () => {
    const updates = {};
    const tasks = Object.entries(PRINT_LOGOS).map(async ([key, url]) => {
      if (LOGO_CACHE[key] && !force) return;
      const dataUrl = await loadImageAsDataURL(url);
      if (dataUrl) updates[key] = dataUrl;
    });
    await Promise.all(tasks);
    if (Object.keys(updates).length) {
      Object.assign(LOGO_CACHE, updates);
      try { localStorage.setItem(LOGO_STORAGE_KEY, JSON.stringify(LOGO_CACHE)); } catch(e) {}
    }
    return LOGO_CACHE;
  })();
  return LOGO_PRELOAD_PROMISE;
}

// مفتاح تشفير/تعمية يُنشأ عشوائياً لكل متصفح (لا يوجد مفتاح ثابت في الكود)
function getObfKey() {
  let key = null;
  try { key = localStorage.getItem(OBF_KEY_STORE); } catch (e) {}
  if (!key) {
    key = randomHex(64);
    try { localStorage.setItem(OBF_KEY_STORE, key); } catch (e) {}
  }
  return key;
}

function obfuscate(text) {
  try {
    const key = getObfKey();
    const encoded = new TextEncoder().encode(text);
    let result = '';
    for (let i = 0; i < encoded.length; i++) result += String.fromCharCode(encoded[i] ^ key.charCodeAt(i % key.length));
    return btoa(result);
  } catch(e) { return ''; }
}
function deobfuscate(encoded) {
  try {
    if (!encoded) return '';
    const key = getObfKey();
    const raw = atob(encoded);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i) ^ key.charCodeAt(i % key.length);
    return new TextDecoder().decode(bytes);
  } catch(e) { return ''; }
}

const targetSpecialtyOf = r => (r.target_specialty || r.specialty || '—');

// هل هذه الإحالة واردة لطبيب معيّن (حسب قسمه)؟
function isReferralInDoctorInbox(r) {
  const dept = CURRENT_USER.department;
  if (r.status === 'consulting') {
    return !!dept && (r.consult_departments || []).includes(dept) && !(r.department_responses || []).some(x => x.department === dept);
  }
  if (r.status === 'awaiting_final') return !!dept && r.target_specialty === dept;
  if (r.status === 'awaiting_doctor' || r.status === 'resubmitted') {
    if (!r.target_specialty) return true; // توافق قديم: إحالات قديمة بدون قسم نهائي تظهر لكل الأطباء
    return !!dept && r.target_specialty === dept;
  }
  return false;
}

// رد قسم استشاري (مرحلة consulting) — وعند اكتمال كل الردود تنتقل تلقائياً للقسم النهائي
function submitDepartmentResponse(id, recommendation, notes) {
  const r = DATA.referrals.find(x => x.id === id);
  if (!r) return { ok: false, error: 'الإحالة غير موجودة' };
  if (r.status !== 'consulting') return { ok: false, error: 'الإحالة ليست في مرحلة استشارة الأقسام' };
  const dept = CURRENT_USER.department;
  if (!dept || !(r.consult_departments || []).includes(dept)) return { ok: false, error: 'قسمك ليس ضمن الأقسام المطلوب استشارتها' };
  if ((r.department_responses || []).some(x => x.department === dept)) return { ok: false, error: 'قسمك سبق أن أرسل رأيه' };
  if (!notes || !notes.trim()) return { ok: false, error: 'الرأي / الملاحظات إلزامية' };

  r.department_responses = r.department_responses || [];
  r.department_responses.push({
    id: uid(), department: dept, doctor_id: CURRENT_USER.id, doctor_name: CURRENT_USER.full_name,
    recommendation: recommendation || 'محايد', notes: notes.trim(), responded_at: nowIso()
  });
  r.updated_at = nowIso();
  if (!r.timeline) r.timeline = [];
  r.timeline.push({ ts: nowIso(), from: 'consulting', to: 'consulting', user: CURRENT_USER.full_name, role: CURRENT_USER.role, user_id: CURRENT_USER.id, action: `رد قسم ${dept}`, details: { recommendation: recommendation || 'محايد', notes: notes.trim() } });

  const pending = (r.consult_departments || []).filter(d => !r.department_responses.some(x => x.department === d));
  if (!pending.length) {
    r.status = 'awaiting_final';
    r.updated_at = nowIso();
    r.timeline.push({ ts: nowIso(), from: 'consulting', to: 'awaiting_final', user: 'النظام', role: '—', user_id: null, action: 'اكتملت ردود الأقسام — أحيلت للقسم النهائي', details: {} });

  }
  saveData();
  audit('department_response', 'referral', r.id, `${dept}: ${recommendation || 'محايد'}`);
  return { ok: true, r };
}

// ═══════════════════════════════════════════════════════════════════
// IndexedDB للمرفقات
// ═══════════════════════════════════════════════════════════════════
let ATTS_DB = null;
let ATTS_DB_PROMISE = null;
let ATTS_DB_OK = false;

function openAttsDB() {
  if (ATTS_DB_PROMISE) return ATTS_DB_PROMISE;
  ATTS_DB_PROMISE = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('IndexedDB غير متاح'));
    try {
      const req = indexedDB.open('wasl_attachments_v1', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('attachments')) db.createObjectStore('attachments', { keyPath: 'id' });
      };
      req.onsuccess = e => { ATTS_DB = e.target.result; ATTS_DB_OK = true; resolve(ATTS_DB); };
      req.onerror = () => reject(req.error || new Error('IndexedDB error'));
    } catch (err) { reject(err); }
  });
  return ATTS_DB_PROMISE;
}
async function attsPut(id, blob) {
  const db = await openAttsDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('attachments', 'readwrite');
    tx.objectStore('attachments').put({ id, blob });
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function attsGet(id) {
  const db = await openAttsDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('attachments', 'readonly');
    const req = tx.objectStore('attachments').get(id);
    req.onsuccess = () => res(req.result ? req.result.blob : null);
    req.onerror = () => rej(req.error);
  });
}

// ═══════════════════════════════════════════════════════════════════
// التشفير SHA-256
// ═══════════════════════════════════════════════════════════════════
const SHA256 = (function() {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const rr = (x,n) => (x>>>n)|(x<<(32-n));
  return function(str) {
    const utf8 = new TextEncoder().encode(str);
    const len = utf8.length;
    const padLen = ((len + 8) >> 6 << 6) + 64;
    const buf = new Uint8Array(padLen);
    buf.set(utf8); buf[len] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(padLen - 8, Math.floor(len * 8 / 0x100000000), false);
    dv.setUint32(padLen - 4, len * 8 >>> 0, false);
    let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    for (let i = 0; i < padLen; i += 64) {
      const w = new Uint32Array(64);
      for (let j = 0; j < 16; j++) w[j] = dv.getUint32(i + j*4, false);
      for (let j = 16; j < 64; j++) {
        const s0 = rr(w[j-15],7) ^ rr(w[j-15],18) ^ (w[j-15]>>>3);
        const s1 = rr(w[j-2],17) ^ rr(w[j-2],19) ^ (w[j-2]>>>10);
        w[j] = (w[j-16] + s0 + w[j-7] + s1) >>> 0;
      }
      let [a,b,c,d,e,f,g,h] = H;
      for (let j = 0; j < 64; j++) {
        const S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[j] + w[j]) >>> 0;

function loadDataSync() {

  } catch (e) {}
  return null;
}

async function loadData() {
  // Supabase عبر /api/state هو المصدر الوحيد للحالة المشتركة بين الأجهزة.
  // لا نستخدم localStorage كاحتياطي هنا حتى لا تعيد نسخة قديمة الكتابة فوق
  // بيانات أحدث حفظها جهاز آخر عند حدوث انقطاع شبكي مؤقت.
  const res = await fetch(API_BASE + '/api/state', { cache: 'no-store' });
  if (!res.ok) throw new Error(`فشل تحميل البيانات من الخادم (${res.status})`);
  const p = await res.json();
  if (p === null) return null;
  if (!p || !p.meta || p.meta.version !== 'v6') {
    throw new Error('البيانات المشتركة في الخادم غير صالحة أو بإصدار غير مدعوم');
  }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {}
  return p;
}

  if (_saveTimer) clearTimeout(_saveTimer);

        method: 'PUT',

}

function transitionReferral(id, to, payload = {}) {
  const r = DATA.referrals.find(x => x.id === id);
  if (!r) return { ok: false, error: 'الإحالة غير موجودة' };
  const from = r.status;
  const allowed = TRANSITIONS[from] || [];
  if (!allowed.includes(to)) return { ok: false, error: `لا يمكن الانتقال من "${STATES[from]?.label || from}" إلى "${STATES[to]?.label || to}"` };
  const permKey = `${from}→${to}`;
  const perm = ACTION_PERMS[permKey];
  if (!perm) return { ok: false, error: 'الانتقال غير معرّف' };
  if (!perm.roles.includes(CURRENT_USER.role)) return { ok: false, error: `هذا الإجراء متاح فقط لـ: ${perm.roles.map(roleLabel).join('، ')}` };
  if (from === 'awaiting_final' && CURRENT_USER.role === 'doctor' && CURRENT_USER.department !== r.target_specialty) {
    return { ok: false, error: `القرار النهائي خاص بقسم ${r.target_specialty}` };
  }

  if (to === 'doctor_accepted') {
    if (!payload.notes || !payload.notes.trim()) return { ok: false, error: 'رد على الإحالة إلزامي' };
    r.doctor_decision = 'accepted';
    r.doctor_notes = payload.notes.trim();
    r.doctor_responded_at = nowIso();
    r.assigned_doctor_id = r.assigned_doctor_id || CURRENT_USER.id;
    const meta = REFERRAL_TYPE_META[r.priority];
    r.admission_type = meta ? meta.admission : 'قبول تنويم';
    r.ward_type = (payload.ward_type && payload.ward_type.trim()) || '';
    r.doctor_mobile = (payload.doctor_mobile && payload.doctor_mobile.trim()) || '';
    notifyRole('coordinator', r.id, 'الطبيب قَبِل الإحالة — بانتظار توجيهك', CURRENT_USER.full_name);
  }
  if (to === 'doctor_rejected') {
    if (!payload.reason || !payload.reason.trim()) return { ok: false, error: 'سبب الرفض إلزامي' };
    r.doctor_decision = 'rejected';
    r.rejection_reason = payload.reason;
    r.doctor_notes = payload.notes || '';
    r.doctor_responded_at = nowIso();
    r.assigned_doctor_id = r.assigned_doctor_id || CURRENT_USER.id;
    notifyRole('coordinator', r.id, `الطبيب رفض الإحالة — السبب: ${payload.reason}`, CURRENT_USER.full_name);
  }
  if (to === 'info_requested') {
    if (!payload.needed_info || !payload.needed_info.trim()) return { ok: false, error: 'المعلومات المطلوبة إلزامية' };
    r.doctor_decision = 'info_requested';
    r.doctor_notes = payload.notes || '';
    r.needed_info = payload.needed_info;
    r.doctor_responded_at = nowIso();
    r.assigned_doctor_id = r.assigned_doctor_id || CURRENT_USER.id;
    notifyRole('coordinator', r.id, `الطبيب يطلب استكمال: ${payload.needed_info}`, CURRENT_USER.full_name);
  }
  if (to === 'consultation_done') {
    if (!payload.consultation_opinion || !payload.consultation_opinion.trim()) return { ok: false, error: 'رأي الطبيب الاستشاري إلزامي' };
    if (!payload.consultation_recommendations || !payload.consultation_recommendations.trim()) return { ok: false, error: 'التوصيات الطبية إلزامية' };
    r.consultation_opinion = payload.consultation_opinion.trim();
    r.consultation_recommendations = payload.consultation_recommendations.trim();
    r.consultation_followup = payload.consultation_followup || 'لا';
    r.consultation_notes = payload.consultation_notes || '';
    r.consultation_at = nowIso();
    r.doctor_mobile = (payload.doctor_mobile && payload.doctor_mobile.trim()) || r.doctor_mobile || '';
    r.doctor_decision = 'consultation';
    r.doctor_responded_at = nowIso();
    r.assigned_doctor_id = r.assigned_doctor_id || CURRENT_USER.id;
    notifyRole('coordinator', r.id, '📋 الطبيب أرسل الاستشارة الطبية — جاهزة للطباعة', CURRENT_USER.full_name);
  }
  if (to === 'resubmitted') {
    r.supplement_notes = payload.notes || '';
    r.resubmitted_at = nowIso();
    r.resubmitted_by = CURRENT_USER.id;
    r.doctor_decision = null;
    r.doctor_notes = '';
    r.doctor_responded_at = null;
    r.needed_info = null;
    r.doctor_viewed_at = null;
    if (r.target_specialty) {
      DATA.users.filter(u => u.role === 'doctor' && u.active && u.department === r.target_specialty).forEach(u => notifyUser(u.id, r.id, 'المنسق أرسل الاستكمال — أعد المراجعة'));
    } else {
      notifyRole('doctor', r.id, 'المنسق أرسل الاستكمال — أعد المراجعة', CURRENT_USER.full_name);
    }
  }
  if (to === 'awaiting_bed') {
    r.forwarded_to_beds_at = nowIso();
    r.forwarded_by = CURRENT_USER.id;
    notifyRole('beds', r.id, 'إحالة مقبولة — بانتظار قرار إدارة الأسرة', CURRENT_USER.full_name);
  }
  if (to === 'bed_approved') {
    if (!payload.bed_number || !payload.bed_number.trim()) return { ok: false, error: 'رقم السرير إلزامي' };
    const bedNum = payload.bed_number.trim();
    const bed = DATA.beds.find(b => b.number === bedNum);
    if (!bed) return { ok: false, error: `السرير ${bedNum} غير مسجّل في النظام — اختر سريراً من القائمة` };
    if (!bed.available) return { ok: false, error: `السرير ${bed.number} مشغول حالياً` };
    Object.assign(bed, { available: false, current_patient: r.patient_name, current_referral: r.id, updated_at: nowIso() });
    r.bed_id = bed.id;
    r.bed_number = bed.number;
    r.bed_type = bed.type || '';
    r.bed_ward = bed.ward || '';
    r.bed_duration = (payload.bed_duration && payload.bed_duration.trim()) || '';
    r.bed_approved_at = nowIso();
    r.bed_approved_by = CURRENT_USER.id;
    r.bed_notes = payload.notes || '';
    notifyRole('coordinator', r.id, `إدارة الأسرة قبلت — السرير ${bedNum}`, CURRENT_USER.full_name);
  }
  if (to === 'bed_rejected') {
    if (!payload.reason || !payload.reason.trim()) return { ok: false, error: 'سبب الرفض إلزامي' };
    r.bed_rejection_reason = payload.reason;
    r.bed_rejected_at = nowIso();
    r.bed_rejected_by = CURRENT_USER.id;
    notifyRole('coordinator', r.id, `إدارة الأسرة رفضت — السبب: ${payload.reason}`, CURRENT_USER.full_name);
  }
  if (to === 'completed') {
    r.completed_at = nowIso();
    r.completed_by = CURRENT_USER.id;
    r.completed_by_name = CURRENT_USER.full_name;
    r.closure_notes = payload.notes || '';
    if (r.bed_id) {
      const bed = DATA.beds.find(b => b.id === r.bed_id);
      if (bed) Object.assign(bed, { available: true, current_patient: null, current_referral: null, updated_at: nowIso() });
    }
    if (isConsultation(r)) notifyRole('doctor', r.id, '✓ تم إغلاق الاستشارة', CURRENT_USER.full_name);
    else { notifyRole('coordinator', r.id, 'الإحالة مغلقة نهائياً', CURRENT_USER.full_name); if (r.assigned_doctor_id) notifyRole('doctor', r.id, 'الإحالة مغلقة', CURRENT_USER.full_name); }
  }
  if (to === 'cancelled') {
    r.cancelled_at = nowIso();
    r.cancelled_by = CURRENT_USER.id;
    r.cancel_reason = payload.reason || '';
    if (r.bed_id) {
      const bed = DATA.beds.find(b => b.id === r.bed_id);
      if (bed) Object.assign(bed, { available: true, current_patient: null, current_referral: null, updated_at: nowIso() });
    }
    notifyRole('coordinator', r.id, `إلغاء الإحالة — السبب: ${payload.reason || ''}`, CURRENT_USER.full_name);
  }

  if (!r.timeline) r.timeline = [];
  r.timeline.push({ ts: nowIso(), from, to, user: CURRENT_USER.full_name, role: CURRENT_USER.role, user_id: CURRENT_USER.id, action: perm.label, details: { ...payload } });
  r.status = to;
  r.updated_at = nowIso();
  saveData();
  audit('state_change', 'referral', r.id, `${from} → ${to}`);
  return { ok: true, r };
}

function getTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function ensureChatShiftsData() {
  if (!Array.isArray(DATA.chats)) DATA.chats = [];
  if (!Array.isArray(DATA.shifts)) DATA.shifts = [];
  const defaults = [
    { name: 'جميع المنسقين', category: 'coordinator' },
    { name: 'جميع الأطباء', category: 'doctor' },
    { name: 'إدارة الأسرة', category: 'beds' },
    { name: 'المديرون', category: 'admin' },
    { name: 'الجميع', category: 'all' }
  ];
  let changed = false;
  for (const g of defaults) {
    const ex = DATA.chats.find(c => c.type === 'group' && c.category === g.category && c.name === g.name);
    if (!ex) {
      DATA.chats.push({ id: 'C_' + uid(), type: 'group', name: g.name, category: g.category, members: 'auto', created_by: 'system', created_at: nowIso(), reads: {}, messages: [] });
      changed = true;
    }
  }
  if (changed) saveData();
}

function isMemberOfChat(chat, userId) {
  if (chat.type === 'direct') return (chat.members || []).includes(userId);
  if (chat.category === 'all') return true;
  if (chat.category === 'custom') return (chat.members || []).includes(userId);
  const u = DATA.users.find(x => x.id === userId);
  return !!(u && u.role === chat.category);
}
function getChatsForUser() { return (DATA.chats || []).filter(c => isMemberOfChat(c, CURRENT_USER.id)); }
function getChatDisplayName(chat) {
  if (chat.type === 'group') return chat.name;
  const otherId = (chat.members || []).find(id => id !== CURRENT_USER.id);
  const other = DATA.users.find(u => u.id === otherId);
  return other ? other.full_name : '—';
}
function getChatSubtitle(chat) {
  if (chat.type === 'group') {
    const catLabel = { coordinator: 'المنسقون', doctor: 'الأطباء', beds: 'إدارة الأسرة', admin: 'المديرون', all: 'الجميع', custom: 'مجموعة' }[chat.category] || 'مجموعة';
    return '👥 ' + catLabel;
  }
  const otherId = (chat.members || []).find(id => id !== CURRENT_USER.id);
  const other = DATA.users.find(u => u.id === otherId);
  return other ? roleLabel(other.role) + (other.department ? ' — ' + other.department : '') : '';
}
function getUnreadCount(chat) {
  const lastRead = (chat.reads && chat.reads[CURRENT_USER.id]) || '1970-01-01T00:00:00.000Z';
  return (chat.messages || []).filter(m => m.from !== CURRENT_USER.id && m.ts > lastRead).length;
}
function getTotalUnreadChats() { return getChatsForUser().reduce((sum, c) => sum + getUnreadCount(c), 0); }
function markChatAsRead(chatId) {
  const chat = DATA.chats.find(c => c.id === chatId);
  if (!chat) return;
  if (!chat.reads) chat.reads = {};
  chat.reads[CURRENT_USER.id] = nowIso();
  saveData();
}
function getOrCreateDirectChat(userId) {
  if (userId === CURRENT_USER.id) return null;
  const existing = DATA.chats.find(c => c.type === 'direct' && (c.members || []).length === 2 && c.members.includes(userId) && c.members.includes(CURRENT_USER.id));
  if (existing) return existing;
  const chat = { id: 'C_' + uid(), type: 'direct', name: '', category: 'direct', members: [CURRENT_USER.id, userId], created_by: CURRENT_USER.id, created_at: nowIso(), reads: {}, messages: [] };
  DATA.chats.push(chat);
  saveData();
  return chat;
}

async function sendChatMessage(chatId, text, files) {
  const chat = DATA.chats.find(c => c.id === chatId);
  if (!chat) return { ok: false, error: 'المحادثة غير موجودة' };
  if (!isMemberOfChat(chat, CURRENT_USER.id)) return { ok: false, error: 'غير مصرح لك بالإرسال في هذه المحادثة' };
  text = (text || '').trim();
  const MAX_SIZE = 15 * 1024 * 1024;
  const validFiles = (files || []).filter(f => {
    const isImage = (f.type || '').startsWith('image/');
    const isPdf = f.type === 'application/pdf';
    return (isImage || isPdf) && f.size <= MAX_SIZE;
  });
  if (!text && !validFiles.length) return { ok: false };
  const msg = { id: 'M_' + uid(), from: CURRENT_USER.id, from_name: CURRENT_USER.full_name, text, atts: [], ts: nowIso() };
  for (const file of validFiles) {
    try {
      const attId = 'ATT-' + uid();
      await attsPut(attId, file);
      DATA.attachments[attId] = { id: attId, referral_id: 'chat-' + chatId, name: file.name, type: file.type || 'application/octet-stream', size: file.size, uploaded_at: nowIso() };
      msg.atts.push(attId);
    } catch(e) { toast('فشل رفع: ' + file.name, 'err'); }
  }
  chat.messages.push(msg);
  if (!chat.reads) chat.reads = {};
  chat.reads[CURRENT_USER.id] = nowIso();
  saveData();
  return { ok: true };
}

function getShiftsForDate(d) { return (DATA.shifts || []).filter(s => s.date === d); }
function getTodayShifts() { return getShiftsForDate(getTodayStr()); }
function addShift(data) {
  const s = { id: 'S_' + uid(), date: data.date, shift: data.shift, role: data.role, user_id: data.user_id, user_name: data.user_name, notes: data.notes || '', created_by: CURRENT_USER.id, created_at: nowIso() };
  DATA.shifts.push(s);
  saveData();
  audit('shift_added', 'shift', s.id, `${s.date} ${s.shift} ${s.user_name}`);
  return s;
}
function deleteShift(id) {
  DATA.shifts = DATA.shifts.filter(s => s.id !== id);
  saveData();
  audit('shift_deleted', 'shift', id, '');
}

  const year = new Date().getFullYear();
  const prefix = `REQ-${year}-`;
  const thisYearCount = DATA.users.filter(u => u.tracking_no && u.tracking_no.startsWith(prefix)).length;
  return `${prefix}${String(thisYearCount + 1).padStart(4, '0')}`;
}

function doTrackRequest(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const trackNo = (fd.get('tracking_no') || '').trim().toUpperCase();
  const mobile = (fd.get('mobile') || '').trim();
  const errEl = $('trackErr');
  errEl.classList.add('hidden');

  if (!user) { errEl.textContent = '❌ رقم الطلب غير موجود'; errEl.classList.remove('hidden'); return; }
  if (mobile.replace(/[\s-]/g,'') !== String(user.mobile).replace(/[\s-]/g,'')) { errEl.textContent = '❌ الجوال غير مطابق'; errEl.classList.remove('hidden'); return; }
  let badge, txt;
  if (user.rejected) { badge = '<span class="pill p-r" style="font-size:13px;padding:8px 18px">❌ مرفوض</span>'; txt = 'السبب: ' + esc(user.rejection_reason || '—'); }
  else if (user.pending_approval) { badge = '<span class="pill p-warn" style="font-size:13px;padding:8px 18px">⏳ قيد المراجعة</span>'; txt = 'سيتم مراجعة طلبك قريباً'; }

function completeApproval(e, id) {
  e.preventDefault();
  const u = DATA.users.find(x => x.id === id);
  if (!u) return;
  const d = Object.fromEntries(new FormData(e.target));
  const pwErrors = validatePasswordPolicy(d.temp_password, u.username);
  const errEl = $('approveErr');
  if (pwErrors.length) { errEl.textContent = '❌ ' + pwErrors.join(' • '); errEl.classList.remove('hidden'); return; }
  if (d.role === 'doctor' && !d.department) { errEl.textContent = '❌ القسم مطلوب للأطباء'; errEl.classList.remove('hidden'); return; }
  const salt = randomHex(32);
  u.salt = salt; u.hash = hashPassword(d.temp_password, salt);
  u.plain_password = obfuscate(d.temp_password);
  u.role = d.role;
  u.department = d.role === 'doctor' ? d.department : null;
  u.active = true; u.pending_approval = false; u.rejected = false;
  u.must_change_password = true; u.password_changed_at = nowIso();
  saveData();
  audit('user_approved', 'user', id, u.username);
  toast('✓ تم التفعيل', 'ok');
  $('modalRoot').innerHTML = `<div class="modal-back" onclick="if(event.target===this){closeModal();if(PAGE==='users')renderUsers()}"><div class="modal" style="max-width:480px">
    <div class="mh"><h3>✓ بيانات الدخول</h3><button class="ghost sm" onclick="closeModal()">✕</button></div>

      <div class="d"><small>كلمة المرور</small><strong>${esc(d.temp_password)}</strong></div>
    </div>
    <button class="primary" onclick="navigator.clipboard.writeText('User: ${esc(u.username)}\\nPass: ${esc(d.temp_password)}').then(()=>toast('تم النسخ','ok'))" style="width:100%">📋 نسخ</button>
  </div></div>`;
}

function rejectRegistration(id) {
  const u = DATA.users.find(x => x.id === id);
  if (!u) return;
  const reason = prompt(`سبب الرفض لـ "${u.full_name}":`, 'بيانات غير مكتملة');
  if (reason === null) return;
  u.pending_approval = false; u.rejected = true; u.rejected_at = nowIso();
  u.rejection_reason = reason; u.active = false;

function doLogin() {
  const u = $('loginUser').value.trim();
  const p = $('loginPass').value;
  const errEl = $('loginErr');
  errEl.classList.add('hidden');
  if (!u || !p) { errEl.textContent = 'أكمل البيانات'; errEl.classList.remove('hidden'); return; }
  $('loginBtn').disabled = true; $('loginBtnText').textContent = 'جاري التحقق...';
  try {
    if (!DATA.users.length) seedIfNeeded(true);
    let user = DATA.users.find(x => x.username === u);
    if (!user) { seedIfNeeded(true); user = DATA.users.find(x => x.username === u); }
    if (!user) throw new Error(`الحساب "${u}" غير موجود`);
    if (user.rejected) throw new Error('تم رفض التسجيل');
    if (user.pending_approval) throw new Error('بانتظار موافقة المدير');
    if (!user.active) throw new Error('الحساب معطّل');
    if (user.locked_until && new Date(user.locked_until) > new Date()) {
      const mins = Math.ceil((new Date(user.locked_until) - new Date()) / 60000);
      throw new Error(`الحساب مقفل ${mins} دقيقة`);
    }
    if (!verifyPassword(p, user.salt, user.hash)) {
      user.failed_attempts = (user.failed_attempts || 0) + 1;
      if (user.failed_attempts >= 5) {
        user.locked_until = new Date(Date.now() + 15 * 60000).toISOString();
        user.failed_attempts = 0; saveData();
        audit('account_locked', 'user', user.id, '');
        throw new Error('تم قفل الحساب 15 دقيقة');
      }
      saveData();
      throw new Error(`كلمة المرور خاطئة — متبقٍ ${5 - user.failed_attempts}`);
    }
    user.failed_attempts = 0; user.locked_until = null; saveData();
    CURRENT_USER = user;
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ userId: user.id, exp: Date.now() + 8 * 3600e3 }));
    audit('login_success', 'user', user.id, '');
    enterApp();
  } catch (e) {
    errEl.textContent = '❌ ' + e.message;
    errEl.classList.remove('hidden');
    $('loginBtn').disabled = false; $('loginBtnText').textContent = 'دخول';
  }
}

function doLogout() {
  if (CURRENT_USER) audit('logout', 'user', CURRENT_USER.id, '');
  sessionStorage.removeItem(SESSION_KEY);
  CURRENT_USER = null; CURRENT_CHAT = null;
  $('app').classList.add('hidden');
  $('loginScreen').classList.remove('hidden');

  $('modalRoot').innerHTML = '';
}

function doForgotWithOld(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const username = (fd.get('username') || '').trim();
  const oldPass = fd.get('old_password');
  const newPass = fd.get('new_password');
  const confirm = fd.get('confirm_password');
  const errEl = $('forgotErr1');
  errEl.classList.add('hidden');
  const showErr = msg => { errEl.textContent = '❌ ' + msg; errEl.classList.remove('hidden'); };
  const user = DATA.users.find(x => x.username === username);
  if (!user) return showErr('اسم المستخدم غير موجود');
  if (user.pending_approval) return showErr('بانتظار الموافقة');
  if (user.rejected) return showErr('مرفوض');
  if (!user.active) return showErr('معطّل');
  if (!verifyPassword(oldPass, user.salt, user.hash)) return showErr('كلمة المرور الحالية خاطئة');
  if (newPass !== confirm) return showErr('غير متطابقتين');
  if (newPass === oldPass) return showErr('يجب أن تختلف');
  const policyErrors = validatePasswordPolicy(newPass, user.username);
  if (policyErrors.length) return showErr(policyErrors.join(' • '));
  if (!user.password_history) user.password_history = [];
  user.password_history.unshift({ salt: user.salt, hash: user.hash, changed_at: nowIso() });
  if (user.password_history.length > 3) user.password_history.length = 3;
  const newSalt = randomHex(32);
  user.salt = newSalt; user.hash = hashPassword(newPass, newSalt);
  user.plain_password = obfuscate(newPass);
  user.must_change_password = false;
  user.password_changed_at = nowIso();
  saveData(); audit('password_recovered_with_old', 'user', user.id, '');
  closeModal(); toast('✓ تم تعيين كلمة المرور', 'ok');
}

function buildNav() {

    const accepted = refs.filter(x => x.status === 'doctor_accepted');
    const consultation = refs.filter(x => x.status === 'consultation_done');

      { id: 'reports', icon: '▤', label: 'التقارير' }
    ];

      { id: 'doctor_responded', icon: '✓', label: 'تم الرد عليها', count: refs.filter(x => hasDoctorResponded(x, CURRENT_USER.id)).length }

    if (CURRENT_USER.role === 'doctor') p = 'doctor_inbox';
    else if (CURRENT_USER.role === 'beds') p = 'bed_requests';

  }

  if (p === 'bed_management' && CURRENT_USER.role !== 'admin') {
    p = CURRENT_USER.role === 'beds' ? 'bed_requests' : 'outgoing';
  }
  if (p === 'dashboard' && CURRENT_USER.role === 'doctor') p = 'doctor_inbox';
  if (p === 'dashboard' && CURRENT_USER.role === 'beds') p = 'bed_requests';

  if (p === 'chat') {
    PAGE = 'chat'; buildNav();

    try { renderChatPage(); } catch(e) { $('main').innerHTML = `<div class="panel"><div class="notice danger">${esc(e.message)}</div></div>`; }

    try { renderShiftsPage(); } catch(e) { $('main').innerHTML = `<div class="panel"><div class="notice danger">${esc(e.message)}</div></div>`; }
    return;

  PAGE = p; buildNav();

    dashboard:['لوحة التحكم','نظرة شاملة على جميع الإحالات'],
    create:['إحالة جديدة','تسجيل حالة جديدة'],
    outgoing:['جميع الإحالات','كل الإحالات في النظام'],
    forward_consultant:['قبول الطبيب','إحالات قَبِلها الطبيب — بانتظار توجيهك'],
    consultation_ready:['الاستشارات الجاهزة','استشارات جاهزة للطباعة والإغلاق'],
    need_supplement:['استكمال مطلوب','الطبيب يطلب معلومات إضافية'],
    bed_decisions:['قرارات الأسرة','قبول/رفض الأسرة — بانتظار إجراء'],
    reports:['التقارير','الإحالات المكتملة'],
    doctor_inbox:['الوارد','الإحالات الجديدة بانتظار قرارك'],
    doctor_responded:['تم الرد عليها','كل قراراتك السابقة'],
    bed_requests:['طلبات الأسرة','بانتظار قرار الأسرة'],
    bed_management:['إدارة الأسرة','حالة كل سرير'],
    users:['المستخدمون','إدارة الحسابات'],
    audit:['سجل التدقيق','كل العمليات'],
    notifications:['الإشعارات','التنبيهات']
  };
  const [t, s] = T[p] || ['—', ''];
  $('main').innerHTML = `
    <div class="ph">
      <div><h2>${t}</h2><p>${s}</p></div>
      <div>${(CURRENT_USER.role === 'coordinator' || CURRENT_USER.role === 'admin') && p === 'outgoing' ? '<button class="primary" onclick="showPage(\'create\')">＋ إحالة جديدة</button>' : ''}</div>
    </div>
    <div id="content"></div>`;
  try { renderPage(p); }
  catch (e) { $('content').innerHTML = `<div class="panel"><div class="notice danger">${esc(e.message)}</div></div>`; console.error(e); }
}

function renderPage(p) {
  if (p === 'dashboard') return renderDashboard();
  if (p === 'create') return renderCreate();
  if (p === 'users') return renderUsers();
  if (p === 'audit') return renderAudit();
  if (p === 'bed_management') return renderBedManagement();
  if (p === 'notifications') return renderNotifications();
  return renderList(p);
}

function renderDashboard() {
  const all = DATA.referrals;
  const active = all.filter(r => !STATES[r.status]?.terminal);
  const byStatus = {};
  Object.keys(STATES).forEach(s => byStatus[s] = all.filter(r => r.status === s).length);
  const byType = {}, bySpecialty = {};
  all.forEach(r => {

        ${typeEntries.map(e => `<div style="display:flex;justify-content:space-between;padding:10px 12px;background:#f7f9fa;border-radius:8px;align-items:center"><b>${e.meta.icon} ${esc(e.type)}</b><span style="color:${e.meta.color};font-weight:700;font-size:16px">${e.count}</span></div>`).join('')}
      </div></div>

        ${Object.entries(bySpecialty).sort((a,b)=>b[1]-a[1]).slice(0, 6).map(([k, v]) => `<div style="display:flex;justify-content:space-between;padding:10px 12px;background:#f7f9fa;border-radius:8px"><b>${esc(k)}</b><span style="color:var(--teal);font-weight:700">${v}</span></div>`).join('') || '<div class="empty">لا توجد</div>'}

function renderList(p) {
  let list = DATA.referrals.slice();
  if (p === 'outgoing') list = list.filter(r => !STATES[r.status]?.terminal);
  if (p === 'forward_consultant') list = list.filter(r => r.status === 'doctor_accepted');
  if (p === 'consultation_ready') list = list.filter(r => r.status === 'consultation_done');
  if (p === 'need_supplement') list = list.filter(r => r.status === 'info_requested');
  if (p === 'bed_decisions') list = list.filter(r => ['bed_approved', 'bed_rejected'].includes(r.status));
  if (p === 'reports') list = list.filter(r => r.status === 'completed');
  if (p === 'doctor_inbox') list = list.filter(r => isReferralInDoctorInbox(r));
  if (p === 'doctor_responded') list = list.filter(r => hasDoctorResponded(r, CURRENT_USER.id));
  if (p === 'bed_requests') list = list.filter(r => r.status === 'awaiting_bed');
  list.sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));

  $('content').innerHTML = `<div class="panel">
    <h3>القائمة (${list.length})</h3>
    <div style="margin-bottom:14px"><input class="searchbox" placeholder="بحث..." oninput="filterTable(this.value)"></div>
    <div id="listWrap">${tableHTML(list)}</div>
  </div>`;
}

function filterTable(q) {
  const s = q.toLowerCase();
  document.querySelectorAll('#listWrap tbody tr').forEach(tr => { tr.style.display = tr.textContent.toLowerCase().includes(s) ? '' : 'none'; });
}

function tableHTML(list) {
  if (!list.length) return '<div class="empty"><div class="empty-icon">📋</div>لا توجد إحالات</div>';
  const rows = list.map(r => {
    const st = STATES[r.status] || { label: r.status, cls: '' };
    const actor = st.actor && st.actor !== '—' ? `<span class="actor-badge">${roleLabel(st.actor)}</span>` : '';
    const isNew = CURRENT_USER.role === 'doctor' && !r.doctor_viewed_at && ['awaiting_doctor','resubmitted','consulting','awaiting_final'].includes(r.status);
    return `<tr${isNew ? ' style="background:#e8f4f8;border-right:3px solid var(--teal)"' : ''}>
      <td><b style="color:var(--navy)">${esc(refNoOf(r))}</b>${isNew ? ' <span class="pill p-new">🆕</span>' : ''}<div style="font-size:11px;color:var(--muted);margin-top:3px">${esc(r.patient_name)}</div><div style="font-size:10.5px;color:var(--muted)">MRN: ${esc(r.mrn)}</div></td>
      <td>${typeChip(r)}</td>
      <td>${r.target_specialty ? '🎯 ' + esc(r.target_specialty) : esc(r.specialty || '—')}</td>
      <td>${esc(r.priority || '—')}</td>
      <td><span class="pill ${st.cls}">${st.label}</span>${actor}</td>
      <td>${r.bed_number ? `<b>${esc(r.bed_number)}</b>` : '—'}</td>
      <td style="font-size:11px;color:var(--muted);white-space:nowrap">${fmtDate(r.updated_at || r.created_at)}</td>
      <td><button class="secondary sm" onclick="openDetail('${esc(r.id)}')">👁 عرض</button></td>
    </tr>`;
  }).join('');
  return `<div class="twrap"><table class="t"><thead><tr>
    <th>الحالة / المريض</th><th>النوع</th><th>التخصص</th><th>الأولوية</th><th>الحالة</th><th>السرير</th><th>التاريخ</th><th></th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function updateFileInfo(input) {
  const info = $('fileInfo');
  if (!input.files || !input.files.length) { info.style.display = 'none'; return; }
  const files = [...input.files];
  const total = files.reduce((s, f) => s + f.size, 0);
  info.style.display = 'block';
  info.innerHTML = `<b>${files.length} ملف</b> — ${fmtSize(total)}<br><span style="font-size:11px">${files.map(f => esc(f.name) + ' (' + fmtSize(f.size) + ')').join(' • ')}</span>`;
}

async function submitReferral(e) {
  e.preventDefault();
  const f = e.target;
  const fd = new FormData(f);
  const d = Object.fromEntries(fd);
  delete d.files; // لا نخزّن كائن الملفات داخل بيانات الإحالة (تُعالج الملفات بشكل منفصل)
  const targetSpecialty = (d.target_specialty || '').trim();
  const consultDepts = (fd.getAll('consult_departments') || []).map(x => String(x).trim()).filter(x => x && x !== targetSpecialty);
  delete d.consult_departments;
  const submitBtn = $('submitBtn');
  try {
    const refNo = (d.ref_no || '').trim();
    if (!refNo) { toast('رقم الإحالة إلزامي', 'err'); return; }
    if (!d.priority) { toast('نوع الإحالة إلزامي', 'err'); return; }
    if (!targetSpecialty) { toast('القسم النهائي إلزامي', 'err'); return; }
    if (DATA.referrals.some(r => (r.ref_no || '').trim() === refNo && !STATES[r.status]?.terminal)) {
      toast(`رقم "${refNo}" مستخدم`, 'err'); return;
    }
    try { await openAttsDB(); } catch (dbErr) { toast('⚠ المرفقات غير متاحة', 'warn'); }
    const id = 'WS-' + new Date().getFullYear() + '-' + String(++DATA.meta.seq).padStart(4, '0');
    const r = {
      id, ...d, ref_no: refNo,
      age: d.age ? parseInt(d.age) : null,
      target_specialty: targetSpecialty,
      specialty: targetSpecialty,
      consult_departments: consultDepts,
      department_responses: [],
      status: consultDepts.length ? 'consulting' : 'awaiting_final',
      created_by: CURRENT_USER.id, created_at: nowIso(), updated_at: nowIso(),
      assigned_doctor_id: null, attachment_ids: [], timeline: [], doctor_viewed_at: null,
      departments: [targetSpecialty], opinions: []
    };
    const files = f.querySelector('[name=files]').files;
    if (files.length && ATTS_DB_OK) {
      submitBtn.disabled = true;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const isImage = (file.type || '').startsWith('image/');
        const isPdf = file.type === 'application/pdf';
        if (!isImage && !isPdf) { toast(`تخطي "${file.name}" — نوع غير مسموح`, 'warn'); continue; }
        if (file.size > 15 * 1024 * 1024) { toast(`تخطي "${file.name}" — أكبر من 15م.ب`, 'warn'); continue; }
        submitBtn.textContent = `⏳ رفع ${i+1}/${files.length}...`;
        try {
          const attId = 'ATT-' + uid();
          await attsPut(attId, file);
          DATA.attachments[attId] = { id: attId, referral_id: id, name: file.name, type: file.type, size: file.size, uploaded_at: nowIso() };
          r.attachment_ids.push(attId);
        } catch (err) { toast(`فشل رفع "${file.name}"`, 'err'); }
      }
      submitBtn.textContent = '📤 حفظ وإرسال للطبيب';
      submitBtn.disabled = false;
    }
    const initState = consultDepts.length ? 'consulting' : 'awaiting_final';
    r.timeline.push({ ts: nowIso(), from: 'new', to: initState, user: CURRENT_USER.full_name, role: CURRENT_USER.role, user_id: CURRENT_USER.id, action: 'إنشاء الإحالة', details: { القسم_النهائي: targetSpecialty, الأقسام_المستشارة: consultDepts.join('، ') || '—' } });
    DATA.referrals.push(r);
    if (consultDepts.length) {
      DATA.users.filter(u => u.role === 'doctor' && u.active && consultDepts.includes(u.department)).forEach(u => notifyUser(u.id, id, '🩺 إحالة جديدة بانتظار رأي قسمك'));
    } else {
      DATA.users.filter(u => u.role === 'doctor' && u.active && u.department === targetSpecialty).forEach(u => notifyUser(u.id, id, '🩺 إحالة جديدة بانتظار قرارك النهائي (القبول أو الرفض)'));
    }
    if (!saveData()) return;
    audit('referral_created', 'referral', id, `${refNo} — ${d.patient_name} — نهائي:${targetSpecialty}`);
    toast(`✓ تم إنشاء ${refNo}`, 'ok');
    showPage('outgoing');
  } catch (err) {
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = '📤 حفظ وإرسال للطبيب'; }
    toast(err.message, 'err');
  }
}

function openDetail(id) {

  DATA.notifications.forEach(n => { if (n.referral_id === id) n.read = true; });
  if (CURRENT_USER.role === 'doctor' && !r.doctor_viewed_at) r.doctor_viewed_at = nowIso();
  saveData();

  const st = STATES[r.status] || { label: r.status, cls: '' };
  const atts = (r.attachment_ids || []).map(aid => DATA.attachments[aid]).filter(Boolean);
  const actions = getAvailableActions(r);

  const timeline = (r.timeline || []).slice().reverse().map(t => {
    const tst = STATES[t.to] || {};

    ['إلى', r.to_hospital],

function formatDetails(details) {
  const labels = {
    admission_type: 'نوع القبول', ward_type: 'القسم', notes: 'ملاحظات', reason: 'السبب',
    needed_info: 'المعلومات المطلوبة', bed_number: 'رقم السرير', bed_type: 'نوع السرير',

    consultation_followup: 'المتابعة', consultation_notes: 'ملاحظات'
  };
  return Object.entries(details).filter(([k, v]) => v && v !== '' && v !== 'undefined')
    .map(([k, v]) => `<b>${labels[k] || k}:</b> ${esc(String(v)).slice(0, 250)}`).join('<br>');

function fileIcon(t) {
  if (!t) return '📄';
  if (t.startsWith('image/')) return '🖼';
  if (t === 'application/pdf') return '📕';
  return '📄';
}

function closeModal() { $('modalRoot').innerHTML = ''; }

function getAvailableActions(r) {
  const from = r.status;
  const allowed = TRANSITIONS[from] || [];
  const isConsul = isConsultation(r);
  const isClinic = r.priority === 'عيادات' || r.admission_type === 'قبول عيادات';
  const skipBeds = isConsul || isClinic || isDirectER(r);
  const forms = [];

  for (const to of allowed) {
    if (isConsul && to === 'doctor_accepted') continue;
    if (!isConsul && to === 'consultation_done') continue;
    if (to === 'awaiting_bed' && skipBeds) continue;
    if (to === 'completed' && from === 'doctor_accepted' && !skipBeds) continue;

    const key = `${from}→${to}`;
    const perm = ACTION_PERMS[key];
    if (perm && perm.roles.includes(CURRENT_USER.role)) forms.push({ to, ...perm });
  }

  const printableStates = ['doctor_rejected', 'info_requested', 'bed_approved', 'bed_rejected', 'completed', 'cancelled', 'consultation_done'];
  if (from === 'doctor_accepted' && skipBeds) printableStates.push('doctor_accepted');
  const hidePrintForDoctor = CURRENT_USER.role === 'doctor' && isConsul;

  if (printableStates.includes(from) && !hidePrintForDoctor) {
    if (from === 'consultation_done') forms.unshift({ to: 'print', label: '🖨️ طباعة نموذج الاستشارة', btn: 'primary', icon: '🖨' });
    else forms.push({ to: 'print', label: '🖨️ طباعة النموذج', btn: 'primary', icon: '🖨' });
  }
  return { forms };
}

function renderActionForms(r, actions) {
  const from = r.status;
  if (CURRENT_USER.role === 'doctor' && ['awaiting_doctor', 'resubmitted', 'awaiting_final'].includes(from)) {
    return renderCombinedDoctorForm(r);
  }
  if (from === 'consulting' && CURRENT_USER.role === 'doctor' && (r.consult_departments || []).includes(CURRENT_USER.department)) {
    return renderConsultResponseForm(r);
  }
  return actions.forms.map(f => renderActionForm(r, f)).join('');
}

function renderCombinedDoctorForm(r) {
  const meta = typeMetaOf(r);
  const isConsul = isConsultation(r);
  const isFinal = r.status === 'awaiting_final';
  const needWard = ['طارئ', 'تنويم عادي'].includes(r.priority);
  const infoText = isFinal ? `🎯 القرار النهائي لقسم ${targetSpecialtyOf(r)}` : (isConsul ? '📋 استشارة طبية — عبّئ النموذج ثم أرسله للمنسق' : (needWard ? 'يتطلب اختيار قسم/سرير' : 'قبول مباشر — بدون سرير'));
  const themed = isConsul || isFinal;

  return `<div class="action-form" ${themed ? 'style="background:#F1F5F6;border-color:#5A727A"' : ''}>
    <h4 ${themed ? 'style="color:#344B52"' : ''}>${isFinal ? '🎯 القرار النهائي للقسم' : 'قرار الطبيب'}</h4>
    <div class="type-info-box" ${themed ? 'style="border-color:#5A727A"' : ''}>
      <div><small>${isFinal ? 'القسم النهائي' : 'نوع الإحالة'}</small><strong ${themed ? 'style="color:#344B52"' : ''}>${isFinal ? '🎯 ' + esc(targetSpecialtyOf(r)) : meta.icon + ' ' + esc(meta.label)}</strong></div>
      <span style="font-size:11px;color:var(--muted);text-align:left">${infoText}</span>
    </div>
    <form onsubmit="executeCombinedDoctorAction(event,'${r.id}')" data-ref-id="${r.id}">
      <div class="grid2">
        <div class="field full"><label>اختر الإجراء *</label>
          <select name="action_type" id="doctor-action-type" required onchange="onDoctorActionChange(this)">
            <option value="">— اختر —</option>
            <option value="doctor_accepted">${isFinal ? '✓ قبول نهائي' : '✓ قبول الإحالة'}</option>
            <option value="doctor_rejected">${isFinal ? '✕ رفض نهائي' : '✕ رفض الإحالة'}</option>
            <option value="info_requested">📝 طلب استكمال</option>
            ${isConsul && !isFinal ? '<option value="consultation_done">📋 استشارة طبية (إرسال للمنسق)</option>' : ''}
          </select>
        </div>
        <div id="doctor-action-fields" class="full"></div>
      </div>
      <div style="margin-top:14px"><button class="primary" type="submit" id="doctor-action-submit" disabled style="opacity:.5">اختر الإجراء</button></div>
    </form>
  </div>`;
}

function renderConsultResponseForm(r) {
  const responded = (r.department_responses || []).some(x => x.department === CURRENT_USER.department);
  if (responded) return '';
  return `<div class="action-form" style="background:#f5f3ff;border-color:#6c4ab0">
    <h4 style="color:#6d28d9">🏥 رأي قسم ${esc(CURRENT_USER.department)}</h4>
    <div class="notice info" style="margin:0 0 14px 0;background:#f5f3ff;color:#6d28d9;border-color:#d8cbf8">الإحالة مستهدفة لقسم <b>${esc(targetSpecialtyOf(r))}</b> — نحتاج رأي قسمك قبل إحالتها للقرار النهائي</div>

          <option value="يوصي بالقبول">✅ يوصي بالقبول</option>

function executeConsultResponse(e, id) {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  const result = submitDepartmentResponse(id, d.recommendation, d.notes);
  if (!result.ok) return toast(result.error, 'err');
  closeModal(); toast('✓ أُرسل رأي القسم', 'ok'); showPage(PAGE);
}

function onDoctorActionChange(sel) {
  const wrapper = $('doctor-action-fields');
  const submitBtn = $('doctor-action-submit');
  if (!wrapper || !submitBtn) return;
  const v = sel.value;
  if (!v) {
    wrapper.innerHTML = ''; submitBtn.disabled = true; submitBtn.className = 'primary';
    submitBtn.style.opacity = '.5'; submitBtn.style.background = '';
    submitBtn.textContent = 'اختر الإجراء'; return;
  }
  submitBtn.disabled = false; submitBtn.style.opacity = '1'; submitBtn.style.background = '';

  const form = sel.closest('form'); const refId = form?.dataset.refId;
  const ref = refId ? DATA.referrals.find(x => x.id === refId) : null;
  const mobileVal = ref?.doctor_mobile || '';
  const priority = ref?.priority || '';

  if (v === 'doctor_accepted') {
    submitBtn.className = 'success'; submitBtn.textContent = '✓ تنفيذ القبول';
    const wardOptions = WARD_OPTIONS[priority] || [];
    const needWard = wardOptions.length > 0;
    const meta = REFERRAL_TYPE_META[priority];
    wrapper.innerHTML = `
      ${meta ? `<div class="field full"><div class="notice info" style="margin:0">✓ القبول كـ: <b>${meta.admission}</b>${needWard ? ' — اختر القسم' : ''}</div></div>` : ''}
      ${needWard ? `<div class="field full"><label>القسم *</label><select name="ward_type" required><option value="">— اختر —</option>${wardOptions.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>` : `<input type="hidden" name="ward_type" value="">`}
      <div class="field full"><label>الجوال</label><input name="doctor_mobile" type="tel" value="${esc(mobileVal)}"></div>
      <div class="field full"><label>ردك *</label><textarea name="notes" required style="min-height:110px"></textarea></div>`;
  } else if (v === 'doctor_rejected') {
    submitBtn.className = 'danger'; submitBtn.textContent = '✕ تنفيذ الرفض';
    wrapper.innerHTML = `
      <div class="field full"><label>سبب الرفض *</label><textarea name="reason" required style="min-height:110px"></textarea></div>
      <div class="field full"><label>ملاحظات</label><textarea name="notes"></textarea></div>`;
  } else if (v === 'info_requested') {
    submitBtn.className = 'warn'; submitBtn.textContent = '📝 إرسال طلب الاستكمال';
    wrapper.innerHTML = `
      <div class="field full"><label>المعلومات المطلوبة *</label><textarea name="needed_info" required style="min-height:110px"></textarea></div>
      <div class="field full"><label>ملاحظات</label><textarea name="notes"></textarea></div>`;
  } else if (v === 'consultation_done') {
    submitBtn.className = 'primary'; submitBtn.style.background = '#5A727A';
    submitBtn.textContent = '📋 إرسال الاستشارة للمنسق';
    wrapper.innerHTML = `
      <div class="notice info" style="margin:0 0 12px 0;background:#F1F5F6;color:#344B52;border-color:#D7E0E3">📋 ستُرسل للمنسق لطباعة النموذج</div>
      <div class="field full"><label>رأي الطبيب *</label><textarea name="consultation_opinion" required style="min-height:130px"></textarea></div>
      <div class="field full"><label>التوصيات *</label><textarea name="consultation_recommendations" required style="min-height:130px"></textarea></div>
      <div class="field full"><label>متابعة؟</label><select name="consultation_followup"><option>لا</option><option>نعم — عيادة خارجية</option><option>نعم — بعد أسبوع</option><option>نعم — بعد شهر</option><option>نعم — حسب الحالة</option></select></div>
      <div class="field full"><label>ملاحظات</label><textarea name="consultation_notes"></textarea></div>
      <div class="field full"><label>الجوال</label><input name="doctor_mobile" type="tel" value="${esc(mobileVal)}"></div>`;
  }
}

function executeCombinedDoctorAction(e, id) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const to = fd.get('action_type');
  if (!to) return toast('اختر الإجراء', 'err');
  const payload = {};
  for (const [k, v] of fd.entries()) if (k !== 'action_type') payload[k] = v;
  const result = transitionReferral(id, to, payload);
  if (!result.ok) return toast(result.error, 'err');
  closeModal();
  if (to === 'consultation_done') toast('✓ أُرسلت الاستشارة للمنسق', 'ok');
  else toast('✓ تم تنفيذ الإجراء', 'ok');
  showPage(PAGE);
}

function renderActionForm(r, action) {
  if (action.to === 'print') {
    if (CURRENT_USER.role === 'doctor' && isConsultation(r)) return '';
    const isConsulPrint = isConsultation(r);
    const label = isConsulPrint ? '🖨️ طباعة نموذج الاستشارة' : '🖨️ طباعة النموذج';
    if (isConsulPrint) return `<div class="action-form" style="background:#F1F5F6;border-color:#5A727A"><button class="primary" style="background:#5A727A;width:100%;padding:14px" onclick="openPrint('${r.id}')">${label}</button></div>`;
    return `<div class="action-form"><button class="primary" style="width:100%;padding:14px" onclick="openPrint('${r.id}')">${label}</button></div>`;
  }
  let fields = '';
  let actionLabel = action.label;
  let actionIcon = action.icon || '';
  if (action.to === 'completed' && r.status === 'doctor_accepted') {
    if (r.admission_type === 'قبول عيادات') actionLabel = 'تنفيذ قبول العيادات وإغلاق';
    else if (isDirectER(r)) actionLabel = '🚨 تنفيذ قبول الطوارئ وإغلاق';
  }
  if (action.to === 'resubmitted') fields = `<div class="field full"><label>ملخص الاستكمال *</label><textarea name="notes" required></textarea></div>`;
  else if (action.to === 'bed_approved') {
    const availBeds = DATA.beds.filter(b => b.available);
    const bedOptions = availBeds.length
      ? '<option value="">— اختر السرير —</option>' + availBeds.map(b => `<option value="${esc(b.number)}">${esc(b.number)} — ${esc(b.type)} — ${esc(b.ward)}</option>`).join('')
      : '<option value="">⚠ لا توجد أسرة شاغرة</option>';
    fields = `<div class="field"><label>السرير *</label><select name="bed_number" required>${bedOptions}</select></div>
      <div class="field"><label>مدة الحجز</label><input name="bed_duration" placeholder="مثال: 3 أيام"></div>
      <div class="field full"><label>ملاحظات</label><input name="notes"></div>`;
  }
  else if (action.to === 'bed_rejected') fields = `<div class="field full"><label>سبب الرفض *</label><select name="reason" required><option value="">— اختر —</option><option>لا يوجد سرير شاغر</option><option>القسم ممتلئ</option><option>نوع غير متوافق</option><option>يحتاج تقييم</option><option>أخرى</option></select></div>`;
  else if (action.to === 'completed') fields = `<div class="field full"><label>ملاحظات الإغلاق</label><textarea name="notes"></textarea></div>`;
  else if (action.to === 'cancelled') fields = `<div class="field full"><label>سبب الإلغاء *</label><select name="reason" required><option value="">— اختر —</option>${CANCEL_REASONS.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>`;
  else if (action.to === 'awaiting_bed') fields = `<div class="field full"><div class="notice info">سيُرسل لإدارة الأسرة</div></div>`;
  return `<div class="action-form"><h4>${actionIcon} ${actionLabel}</h4><form onsubmit="executeAction(event,'${r.id}','${action.to}')"><div class="grid2">${fields}</div><div style="margin-top:14px"><button class="${action.btn}" type="submit">تنفيذ</button></div></form></div>`;
}

function executeAction(e, id, to) {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  const result = transitionReferral(id, to, d);
  if (!result.ok) return toast(result.error, 'err');
  closeModal(); toast('✓ تم', 'ok'); showPage(PAGE);
}

function renderBedManagement() {
  const beds = DATA.beds;
  const free = beds.filter(b => b.available).length;
  const busy = beds.length - free;
  const cards = beds.map(b => {
    const refer = b.current_referral ? DATA.referrals.find(r => r.id === b.current_referral) : null;
    return `<div class="bed-card ${b.available ? 'free' : 'busy'}">
      <strong>${esc(b.number)}</strong><small>${esc(b.type)} — ${esc(b.ward)}</small>
      <div class="badge"><span class="pill ${b.available ? 'p-done' : 'p-r'}">${b.available ? 'شاغر' : 'مشغول'}</span></div>
      ${refer ? `<small style="margin-top:8px;display:block;color:var(--navy);font-weight:600">${esc(refer.patient_name)}</small>` : ''}
    </div>`;
  }).join('');
  $('content').innerHTML = `
    <div class="stats">
      <div class="stat"><label>إجمالي</label><strong>${beds.length}</strong></div>
      <div class="stat"><label>شاغرة</label><strong style="color:#16734e">${free}</strong></div>
      <div class="stat"><label>مشغولة</label><strong style="color:#b43f3f">${busy}</strong></div>
    </div>
    <div class="panel"><h3>حالة الأسرة</h3><div class="bed-grid">${cards}</div></div>`;
}

// الإشعارات
// ═══════════════════════════════════════════════════════════════════
function renderNotifications() {
  const myNotifs = DATA.notifications.filter(n => {
    if (n.user_id && n.user_id === CURRENT_USER.id) return true;
    if (!n.user_id && (n.role === CURRENT_USER.role || n.role === 'all')) return true;
    return false;
  }).slice(0, 100);

  if (!myNotifs.length) {
    $('content').innerHTML = '<div class="panel"><div class="empty"><div class="empty-icon">🔔</div>لا توجد إشعارات</div></div>';
    return;
  }

  const items = myNotifs.map(n => {
    const r = n.referral_id ? DATA.referrals.find(x => x.id === n.referral_id) : null;
    const st = r ? STATES[r.status] : {};
    const icons = { coordinator: '📥', doctor: '🩺', beds: '🛏', admin: '👑' };
    const clickAttr = n.referral_id ? `onclick="openDetail('${esc(n.referral_id)}')"` : `onclick="showPage('users')"`;
    return `<div class="notif-item ${n.read ? '' : 'unread'}" ${clickAttr}>
      <div class="icon" style="background:${n.read ? '#f2f5f7' : '#e8f4f8'}">${icons[n.role] || '🔔'}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;color:var(--navy);margin-bottom:4px">${esc(n.message)}</div>
        <div style="font-size:12px;color:var(--muted)">
          ${r ? esc(r.patient_name) + ' — ' + esc(refNoOf(r)) + ' — ' : ''}${fmtDate(n.ts)} — من: ${esc(n.from_user)}
          ${st.label ? `<br><span class="pill ${st.cls}" style="margin-top:6px">${st.label}</span>` : ''}
        </div>
      </div>
      ${n.read ? '' : '<div style="background:var(--teal);width:8px;height:8px;border-radius:50%;align-self:center"></div>'}
    </div>`;
  }).join('');

  $('content').innerHTML = `<div class="panel" style="padding:0;overflow:hidden">
    <div style="padding:16px 20px;border-bottom:1px solid var(--line);background:#fafcfc;display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0">آخر ${myNotifs.length} إشعار</h3>
      <button class="ghost sm" onclick="markAllRead()">تعليم الكل كمقروء</button>
    </div>
    ${items}
  </div>`;
}

function markAllRead() {
  DATA.notifications.forEach(n => {
    if (n.user_id === CURRENT_USER.id) n.read = true;
    else if (!n.user_id && (n.role === CURRENT_USER.role || n.role === 'all')) n.read = true;
  });
  saveData();
  renderNotifications();
  buildNav();
}
