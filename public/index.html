async function openPrint(id) {
  const r = DATA.referrals.find(x => x.id === id);
  if (!r) return toast('غير موجود', 'err');
  const w = window.open('', '_blank');
  if (!w) return toast('يرجى السماح بالنوافذ المنبثقة', 'err');
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>جاري التحضير...</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;font-family:sans-serif;background:#f3f6f8}.s{width:52px;height:52px;border:4px solid #e4eaee;border-top-color:#087f78;border-radius:50%;animation:r 1s linear infinite;margin:0 auto 16px}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div style="text-align:center"><div class="s"></div><div style="color:#70818c;font-size:14px">⏳ جاري التحضير...</div></div></body></html>');
  w.document.close();

  const dateStr = s => { if (!s) return '—'; const d = new Date(s); if (isNaN(d.getTime())) return '—'; return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };
  let tpl = 'inpatient';
  if (r.status === 'doctor_rejected' || r.status === 'bed_rejected' || r.doctor_decision === 'rejected') tpl = 'reject';
  else if (r.status === 'info_requested' || r.doctor_decision === 'info_requested') tpl = 'missing';
  else if (isConsultation(r)) tpl = 'consultation';
  else if (r.priority === 'عيادات' || r.admission_type === 'قبول عيادات') tpl = 'clinic';
  else if (isDirectER(r)) tpl = 'emergency';
  else if (r.status === 'cancelled' && !r.admission_type) tpl = 'reject';

  const creatorUser = DATA.users.find(u => u.id === r.created_by);
  const doctorUser  = r.assigned_doctor_id ? DATA.users.find(u => u.id === r.assigned_doctor_id) : null;
  const bedUser     = r.bed_approved_by ? DATA.users.find(u => u.id === r.bed_approved_by) : null;

  const d = {
    refNo: refNoOf(r), refDate: dateStr(r.created_at),
    fromHosp: r.from_hospital || 'مستشفى الملك فيصل بمكة', toHosp: r.to_hospital || '—',
    dept: r.specialty || '—', isReverse: r.is_reverse === 'نعم',
    referralType: r.priority || '—',
    patientName: r.patient_name || '—', mrn: r.mrn || '—', age: r.age || '—', gender: r.gender || '—',
    nationality: 'سعودي', diagnosis: r.diagnosis || '—',
    doctorName: doctorUser ? doctorUser.full_name : '—', doctorMobile: r.doctor_mobile || '',
    clinicalText: r.doctor_notes || r.supplement_notes || '—',
    clinicDept: r.specialty || '—', clinicSlot: '', clinicDate: '', clinicInstructions: r.bed_notes || '—',
    consultationOpinion: r.consultation_opinion || r.doctor_notes || '—',
    consultationRecommendations: r.consultation_recommendations || '—',
    consultFollowup: r.consultation_followup || 'لا',
    consultNotes: r.consultation_notes || '—',
    consultDate: dateStr(r.consultation_at || r.doctor_responded_at),
    consultDept: r.specialty || '—',
    bedAvail: r.bed_number ? 'متوفر / Available' : 'غير متوفر / N/A',
    bedEmergency: r.admission_type === 'قبول طوارئ' ? 'نعم / Yes' : 'لا / No',
    bedType: r.bed_type || (isDirectER(r) ? 'طوارئ / ER' : '—'),
    bedRoomNo: r.bed_number || '—',
    bedDept: r.bed_ward || (isDirectER(r) ? 'طوارئ / Emergency' : '—'),
    bedAdmissionDate: dateStr(r.bed_approved_at || r.completed_at || r.doctor_responded_at),
    bedDuration: r.bed_duration || '', bedAdmissionNotes: r.bed_notes || r.closure_notes || '—',
    rejectionReason: r.rejection_reason || r.bed_rejection_reason || r.cancel_reason || '—',
    missingList: r.needed_info || '—',
    refEmployeeName: creatorUser ? creatorUser.full_name : '—', refEmployeeId: creatorUser ? creatorUser.username : '—',
    bedEmployeeName: bedUser ? bedUser.full_name : '—', bedEmployeeId: bedUser ? bedUser.username : '—'
  };
  try { await preloadLogos(); } catch(e) {}
  const html = buildPrintDocument(tpl, d);
  audit('print_opened', 'referral', id, tpl);
  w.document.open(); w.document.write(html); w.document.close();

  let polls = 0;
  const check = () => {
    try {
      if (w.closed) return;
      const btn = w.document.getElementById('printBtn');
      if (!btn) { if (polls++ < 50) setTimeout(check, 100); return; }
      const imgs = w.document.querySelectorAll('.print-header img');
      let ok = true;
      if (imgs.length) for (const img of imgs) if (!(img.complete && img.naturalWidth > 0)) { ok = false; break; }
      if (ok) btn.disabled = false;
      else if (polls++ < 50) setTimeout(check, 100);
      else btn.disabled = false;
    } catch(e) {}
  };
  setTimeout(check, 100);
}

async function downloadAtt(attId) {
  const meta = DATA.attachments[attId];
  if (!meta) return toast('غير موجود', 'err');
  try {
    let blob = await attsGet(attId);
    if (!blob) return toast('غير متاح', 'err');
    const url = URL.createObjectURL(blob);
    const el = document.createElement('a');
    el.href = url; el.download = meta.name;
    document.body.appendChild(el); el.click(); document.body.removeChild(el);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (err) { toast('فشل: ' + err.message, 'err'); }
}
async function previewAtt(attId) {
  const meta = DATA.attachments[attId];
  if (!meta) return toast('غير موجود', 'err');
  try {
    let blob = await attsGet(attId);
    if (!blob) return toast('غير متاح', 'err');
    const url = URL.createObjectURL(blob);
    const isImage = (meta.type || '').startsWith('image/');
    const isPdf = meta.type === 'application/pdf';
    if (!isImage && !isPdf) return toast('استخدم التنزيل', 'err');
    const content = isImage ? `<img src="${url}" style="max-width:100%;max-height:75vh;border-radius:12px;display:block;margin:0 auto">` : `<iframe src="${url}" style="width:100%;height:75vh;border:1px solid #e4eaee;border-radius:12px"></iframe>`;
    $('modalRoot').innerHTML = `<div class="modal-back" onclick="if(event.target===this){this.remove();URL.revokeObjectURL('${url}')}"><div class="modal"><div class="mh"><h3>${esc(meta.name)}</h3><button class="ghost sm" onclick="this.closest('.modal-back').remove();URL.revokeObjectURL('${url}')">✕</button></div>${content}<div style="margin-top:12px"><a href="${url}" download="${esc(meta.name)}" class="secondary sm" style="text-decoration:none;display:inline-block;padding:8px 14px;border-radius:8px">⤓ تنزيل</a></div></div></div>`;
  } catch (err) { toast('فشل: ' + err.message, 'err'); }
}

function toggleUser(id) {
  const u = DATA.users.find(x => x.id === id);
  if (!u) return;
  u.active = !u.active;
  saveData(); audit('user_toggled', 'user', id, `${u.username} → ${u.active}`);
  renderUsers();
}
function unlockUser(id) {
  const u = DATA.users.find(x => x.id === id);
  if (!u) return;
  u.locked_until = null; u.failed_attempts = 0;
  saveData(); toast('✓ فك القفل', 'ok'); renderUsers();
}
function editUserMobile(id) {
  const u = DATA.users.find(x => x.id === id);
  if (!u) return;
  const nm = prompt(`جوال "${u.username}":`, u.mobile || '05XXXXXXXX');
  if (nm === null) return;
  const err = validateMobile(nm.trim());
  if (err) return toast('❌ ' + err, 'err');
  u.mobile = nm.trim(); saveData(); toast('✓', 'ok'); renderUsers();
}
function addUser(e) {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  if (DATA.users.some(u => u.username === d.username)) return toast('مستخدم مسبقاً', 'err');
  const pwErrors = validatePasswordPolicy(d.password, d.username);
  if (pwErrors.length) return toast('❌ ' + pwErrors.join(' • '), 'err');
  const mobileErr = validateMobile(d.mobile);
  if (mobileErr) return toast('❌ ' + mobileErr, 'err');
  if (d.role === 'doctor' && !d.department) return toast('❌ القسم مطلوب للأطباء', 'err');

  const salt = randomHex(32);
  DATA.users.push({
    id: uid(), username: d.username, salt, hash: hashPassword(d.password, salt),
    plain_password: obfuscate(d.password), mobile: d.mobile.trim(),
    full_name: d.full_name, role: d.role, department: d.role === 'doctor' ? d.department : null,
    active: true, created_at: nowIso(),
    must_change_password: true, password_history: [],
    password_changed_at: null, failed_attempts: 0, locked_until: null,
    pending_approval: false, tracking_no: null, rejected: false, rejected_at: null, rejection_reason: null
  });
  saveData(); audit('user_created', 'user', d.username, '');
  toast('✓ تم', 'ok');
  renderUsers();
}

function renderMessage(chat, m) {
  const mine = m.from === CURRENT_USER.id;
  const isGroup = chat.type === 'group';
  const atts = (m.atts || []).map(id => DATA.attachments[id]).filter(Boolean);
  const time = new Date(m.ts).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
  return `<div class="msg ${mine ? 'mine' : ''}">
    ${isGroup && !mine ? `<div class="sender">${esc(m.from_name)}</div>` : ''}
    ${m.text ? `<div class="txt">${esc(m.text)}</div>` : ''}
    ${atts.length ? `<div class="atts">${atts.map(a => {
      if ((a.type || '').startsWith('image/')) {
        return `<div class="att-file" onclick="previewAtt('${a.id}')" style="padding:3px"><img data-att="${a.id}" alt="${esc(a.name)}" style="max-width:220px;max-height:220px;border-radius:6px;display:block;cursor:pointer" loading="lazy"></div>`;
      }
      return `<div class="att-file" onclick="previewAtt('${a.id}')">📕 ${esc(a.name)} <span style="color:var(--muted);font-weight:400">${fmtSize(a.size)}</span></div>`;
    }).join('')}</div>` : ''}

function openChat(chatId) {
  CURRENT_CHAT = chatId;

  renderChatPage();
  const main = $('chatMain'); const side = $('chatSide');
  if (main) main.classList.add('show');
  if (side) side.classList.remove('show');
  setTimeout(() => {
    const el = $('chatMsgs'); if (el) el.scrollTop = el.scrollHeight;
    document.querySelectorAll('img[data-att]').forEach(async img => {
      const id = img.getAttribute('data-att');
      try { const blob = await attsGet(id); if (blob) img.src = URL.createObjectURL(blob); } catch(e) {}
    });
  }, 50);
  buildNav();
}

function showChatListMobile() {
  const main = $('chatMain'); const side = $('chatSide');
  if (main) main.classList.remove('show');
  if (side) side.classList.add('show');
}

function handleChatFileSelect(inp) {
  if (!inp.files || !inp.files.length) return;
  const allowed = [];
  const rejected = [];
  const MAX_SIZE = 15 * 1024 * 1024;
  Array.from(inp.files).forEach(f => {
    const isImage = (f.type || '').startsWith('image/');
    const isPdf = f.type === 'application/pdf';
    if (!isImage && !isPdf) rejected.push(f.name + ' (نوع غير مسموح)');
    else if (f.size > MAX_SIZE) rejected.push(f.name + ' (أكبر من 15 م.ب)');
    else allowed.push(f);
  });
  if (rejected.length) {
    toast('❌ ' + rejected.join(' • '), 'err');
    try { inp.value = ''; } catch(e) {}
    const preview = $('chatFilePreview');
    if (preview) { preview.style.display = 'none'; preview.innerHTML = ''; }
    return;
  }
  const preview = $('chatFilePreview');
  if (preview) {
    preview.style.display = 'block';
    preview.innerHTML = '📎 ' + allowed.length + ' ملف: ' + allowed.map(f => (f.type === 'application/pdf' ? '📕 ' : '🖼️ ') + esc(f.name)).join(' • ');
  }
}

async function submitChatMessage(e, chatId) {
  if (e) e.preventDefault();
  const ta = $('chatText');
  const fiImg = $('chatImgInput'); const fiPdf = $('chatPdfInput');
  const text = ta ? ta.value.trim() : '';
  let files = [];
  if (fiImg && fiImg.files && fiImg.files.length) files = Array.from(fiImg.files);
  else if (fiPdf && fiPdf.files && fiPdf.files.length) files = Array.from(fiPdf.files);
  if (!text && !files.length) return;
  await sendChatMessage(chatId, text, files);
  if (ta) ta.value = '';
  if (fiImg) fiImg.value = '';
  if (fiPdf) fiPdf.value = '';
  const preview = $('chatFilePreview');
  if (preview) { preview.style.display = 'none'; preview.innerHTML = ''; }
  markChatAsRead(chatId);
  renderChatPage();
  setTimeout(() => { const el = $('chatMsgs'); if (el) el.scrollTop = el.scrollHeight; }, 50);
}

function showNewChatPicker() {

  $('modalRoot').innerHTML = `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:520px">
    <div class="mh"><h3>➕ إضافة مناوب</h3><button class="ghost sm" onclick="closeModal()">✕</button></div>
    <form onsubmit="submitAddShift(event)">
      <div class="field"><label>التاريخ *</label><input type="date" name="date" value="${today}" required></div>
      <div class="field"><label>الفترة *</label><select name="shift" required><option value="صباحي">🌅 صباحي</option><option value="مسائي">🌇 مسائي</option><option value="ليلي">🌙 ليلي</option></select></div>
      <div class="field"><label>الدور *</label><select name="role" required><option value="">— اختر —</option><option value="coordinator">منسق</option><option value="doctor">طبيب</option><option value="beds">إدارة أسرة</option><option value="admin">مدير</option></select></div>
      <div class="field"><label>المستخدم *</label><select name="user_id" required><option value="">— اختر —</option>${users.map(u => `<option value="${u.id}">${esc(u.full_name)} — ${roleLabel(u.role)}${u.department ? ' (' + esc(u.department) + ')' : ''}</option>`).join('')}</select></div>
      <div class="field"><label>ملاحظات</label><input name="notes" placeholder="مثال: قسم الطوارئ"></div>
      <button class="primary" type="submit" style="width:100%">إضافة</button>
    </form>
  </div></div>`;
}

function submitAddShift(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const userId = fd.get('user_id');
  const user = DATA.users.find(u => u.id === userId);
  if (!user) return toast('مستخدم غير موجود', 'err');
  addShift({ date: fd.get('date'), shift: fd.get('shift'), role: fd.get('role'), user_id: userId, user_name: user.full_name, notes: fd.get('notes') });
  closeModal();
  toast('✓ تم', 'ok');
  renderShiftsPage();
}

function resetAll() {
  if (!confirm('⚠ سيتم حذف كل البيانات')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(LOGO_STORAGE_KEY);
  localStorage.removeItem(OBF_KEY_STORE);
  sessionStorage.removeItem(SESSION_KEY);
  try { indexedDB.deleteDatabase('wasl_attachments_v1'); } catch (e) {}
  try { fetch(API_BASE + '/api/state', { method: 'DELETE' }).catch(() => {}); } catch (e) {}
  setTimeout(() => location.reload(), 400);
}

// ═══════════════════════════════════════════════════════════════════
// التشغيل
// ═══════════════════════════════════════════════════════════════════
(async function boot() {
  const btn = $('loginBtn'), btnText = $('loginBtnText'), errEl = $('loginErr');
  try {
    DATA = await loadData();
    if (!DATA) { DATA = initData(); saveData(); }
    if (!DATA.notifications) DATA.notifications = [];
    if (!DATA.attachments || typeof DATA.attachments !== 'object') DATA.attachments = {};
    if (!Array.isArray(DATA.chats)) DATA.chats = [];
    if (!Array.isArray(DATA.shifts)) DATA.shifts = [];
    seedIfNeeded(false);
    migrateOldStates();
    ensureChatShiftsData();
    try { await openAttsDB(); } catch (dbErr) { console.warn('[WASL] IndexedDB:', dbErr.message); }
    preloadLogos().catch(e => console.warn('[WASL] Logo preload:', e));
    const sess = sessionStorage.getItem(SESSION_KEY);
    if (sess) {
      try {
        const s = JSON.parse(sess);
        if (Date.now() < s.exp) {
          const user = DATA.users.find(x => x.id === s.userId);
          if (user && user.active && !user.pending_approval && !user.rejected) { CURRENT_USER = user; enterApp(); return; }
        }
      } catch (e) {}
    }
    btn.disabled = false; btnText.textContent = 'دخول';
  } catch (e) {
    errEl.innerHTML = `<b>فشل التهيئة</b><br>${esc(e.message)}`;
    errEl.classList.remove('hidden'); btnText.textContent = 'فشل التهيئة';
  }
})();
</script>
</body></html>
